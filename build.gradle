plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.springframework.boot:spring-boot-docker-compose'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.rest-assured:rest-assured'
	testImplementation 'io.cucumber:cucumber-java:7.22.0'
	testImplementation 'io.cucumber:cucumber-spring:7.22.0'
	testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.22.0'
	testImplementation 'org.junit.platform:junit-platform-suite'
	testImplementation platform('org.testcontainers:testcontainers-bom:1.20.4')
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:junit-jupiter'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeEngines 'cucumber'
		excludeTags 'integration'
	}
}

tasks.register('cucumberTest', Test) {
	description = 'Runs Cucumber BDD tests.'
	group = 'verification'
	useJUnitPlatform {
		includeEngines 'cucumber'
	}
	systemProperty 'cucumber.plugin', 'pretty, html:build/reports/cucumber/cucumber-report.html'
}

tasks.register('integrationTest', Test) {
	description = 'Runs integration tests with PostgreSQL Testcontainers.'
	group = 'verification'
	useJUnitPlatform {
		includeTags 'integration'
		excludeEngines 'cucumber', 'junit-platform-suite'
	}
	systemProperty 'spring.profiles.active', 'integration'
}
