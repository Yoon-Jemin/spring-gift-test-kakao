services:
  db:
    image: postgres:17-alpine
    container_name: gift-postgres
    environment:
      POSTGRES_DB: gift
      POSTGRES_USER: gift
      POSTGRES_PASSWORD: gift
    ports:
      - "5432:5432"
    volumes:
      - gift-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gift -d gift"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gift-data:
